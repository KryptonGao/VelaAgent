appId: com.vela.desktop
productName: Vela
buildVersion: 0.1.1
artifactName: Vela-${shortVersion}-${arch}.${ext}
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - THIRD_PARTY_LICENSES.md
  # Preserve pnpm's nested dependency layout to prevent fallback to incompatible root-hoisted versions.
  - from: ../../node_modules
    to: node_modules
    filter:
      - "**/node_modules/**"
  # @vela/* 是工作区源码包,已由 electron-vite 打进 out,不需要进 asar
  - "!node_modules/@vela/**"
npmRebuild: false
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  # node-pty 需要真实的 spawn-helper 可执行文件,不能留在 asar 内
  - "**/node_modules/node-pty/**"
mac:
  bundleShortVersion: 0.1.1
  bundleVersion: 0.1.1
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # Keep local macOS builds fast; electron-builder otherwise signs every framework resource.
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  title: Vela ${shortVersion}
